name: omnix_matter_android_app
description: "Isolated Android Matter JNI qualification, not a production controller."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  omnix_nexus:
    path: ../../modules/omnix_nexus

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    omnix_nexus:
      protocols: [matter]
      matter_backend: android_host
