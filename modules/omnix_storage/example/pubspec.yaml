name: omnix_storage_example
hooks:
  user_defines:
    omnix_storage:
      engines: [sqlite, qdrant]
description: Minimal standalone native Storage example.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  omnix_storage:
    path: ../
  path: ^1.9.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
