[package]
name = "omnix_storage_bridge"
version = "0.1.0-dev.3"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[workspace]
members = ["backend"]
resolver = "2"

[features]
default = []
sqlite = ["omnix-storage/rusqlite"]
qdrant = ["omnix-storage/qdrant", "dep:serde_json"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
serde_json = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
omnix-storage = { path = "backend", default-features = false }
tokio = { version = "1", features = ["rt"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
tempfile = "3"
