[package]
name = "omnix-storage"
version = "0.1.0-dev.3"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Omnix native durable conversation storage"
publish = false

[features]
default = []
sqlite = ["rusqlite"]
rusqlite = ["dep:rusqlite", "dep:serde_json", "dep:chrono"]
qdrant = ["dep:qdrant-edge", "dep:serde", "dep:serde_json"]

[dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled"], optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
qdrant-edge = { version = "=0.8.0", optional = true }

[dev-dependencies]
tempfile = "3"
