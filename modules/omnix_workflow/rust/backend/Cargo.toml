[package]
name = "omnix-workflow"
version = "0.1.0-dev.3"
edition = "2021"
license = "Apache-2.0"
description = "Host-driven durable execution for Omnix"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tempfile = "3"
