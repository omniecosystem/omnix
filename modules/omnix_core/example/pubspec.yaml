name: omnix_core_example
description: Minimal standalone native Core example.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  omnix_core:
    path: ../
dev_dependencies:
  test: ^1.26.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

# This isolated example explicitly qualifies the optional second runtime.
hooks:
  user_defines:
    omnix_core:
      litertlm_android_archive: .local-native/litertlm-android-0.18.0.tar.gz
      runtimes: [litertlm, llamacpp]
      android:
        runtimes: [litertlm]
        embeddings: false
        embedding_engine: true
