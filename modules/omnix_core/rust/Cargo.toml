[package]
name = "omnix_core_bridge"
version = "0.1.0-dev.3"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[workspace]
members = ["backend"]
resolver = "2"

[features]
default = []
model-installation = ["omnix-core/model-installation"]
litertlm = ["omnix-core/litertlm"]
llamacpp = ["omnix-core/llamacpp"]
litertlm-embeddings = ["litertlm", "omnix-core/litertlm-embeddings"]
litertlm-embedding-engine = ["litertlm", "omnix-core/litertlm-embedding-engine"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
serde_json = "1"
omnix-core = { path = "backend", default-features = false, features = ["history"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }
