name: omnix_example
description: Native-module assistant proving ground for Omnix.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  omnix:
    path: ..
  omnix_core:
    path: ../modules/omnix_core
  omnix_knowledge:
    path: ../modules/omnix_knowledge
  omnix_nexus:
    path: ../modules/omnix_nexus
  omnix_storage:
    path: ../modules/omnix_storage
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: 11.0.2
  background_downloader: 9.5.9
  record: 6.2.1
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.26.0
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/skills/scheduled-device-report/SKILL.md
    - public_knowledge.json
    - public_knowledge_laptop_b.json
    - assets/skills/current-time/SKILL.md
    - assets/skills/workflow-planning/SKILL.md
    - assets/skills/workflow-planning/examples/two-clock-reads.json
    - assets/skills/workflow-planning/examples/clock-to-format.json
    - assets/skills/device-report-workflow/SKILL.md
    - assets/skills/device-report-workflow/examples/battery-to-share.json
    - assets/skills/workflow-management/SKILL.md
    - assets/skills/workflow-management/examples/list-tasks.json
hooks:
  user_defines:
    omnix:
      windows:
        runtimes: [litertlm]
        knowledge: true
        agent: true
        workflow: true
        litertlm_assets: omnix_core
      android:
        runtimes: [litertlm]
        knowledge: true
        agent: true
        workflow: true
        litertlm_assets: omnix_core
    omnix_core:
      model_installation: true
      litertlm_android_archive: .local-native/litertlm-android-0.18.0.tar.gz
      runtimes: [litertlm, llamacpp]
      embeddings: true
      embedding_engine: true
      android:
        runtimes: [litertlm]
        embeddings: false
        embedding_engine: true
    omnix_knowledge:
      stores: [qdrant]
    omnix_storage:
      engines: [sqlite]
    omnix_nexus:
      protocols: [a2a, matter]
      windows:
        matter_backend: windows_qualification
      android:
        matter_backend: android_host
