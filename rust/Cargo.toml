[package]
name = "omnix"
version = "0.1.0-dev.3"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
omnixus-a2a = { path = "../../omnixus/crates/omnixus-a2a" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
